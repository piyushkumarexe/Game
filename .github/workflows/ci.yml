name: Godot Mobile Builds

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      emit_preview_log:
        description: 'Emit compact base64 render previews for visual review'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: godot-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  validate:
    name: Validate 3D game project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Verify generated RV assets
        run: |
          python3 tools/generate_lowpoly_assets.py
          python3 - <<'PY'
          import json
          exterior = json.load(open('assets/models/rv_exterior.gltf', encoding='utf-8'))
          wheel = json.load(open('assets/models/rv_wheel.gltf', encoding='utf-8'))
          triangles = sum(exterior['accessors'][primitive['indices']]['count'] // 3
                          for mesh in exterior['meshes'] for primitive in mesh['primitives'])
          assert triangles >= 6000, triangles
          assert len(exterior['materials']) >= 28, len(exterior['materials'])
          assert {'StaticRVExterior', 'StaticRVInterior', 'StaticCockpitFrame', 'CockpitSteeringWheel', 'GearLever', 'EntryDoor', 'RoofCargo'} <= {node.get('name') for node in exterior['nodes']}
          assert any(node.get('name') == 'DetailedWheelAssembly' for node in wheel['nodes'])
          source = open('tools/generate_lowpoly_assets.py', encoding='utf-8').read()
          for required in ('FrontRoofBrow', 'FrontLowerShell', 'WindshieldLeft',
                           'CoachWindowBayPillar', 'WheelArchTrim', 'InteriorWindowPillar'):
              assert required in source, f'missing replacement RV component: {required}'
          for removed in ('rv.profile_prism("CabBody"', 'rv.profile_prism("CabHood"',
                          'rv.profile_prism("OvercabSleeper"'):
              assert removed not in source, f'rejected Class-C component returned: {removed}'
          controller = open('scripts/vehicles/rv_controller.gd', encoding='utf-8').read()
          assert controller.count('_add_wheel("') == 4
          assert controller.count('-2.35), true, false)') == 2
          print(f'Replacement RV verified: {triangles} triangles, {len(exterior["materials"])} materials')
          PY
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false
      - name: Import resources and validate scripts
        run: godot --headless --editor --path . --quit
      - name: Launch main scene smoke test
        run: godot --headless --path . --quit-after 3
      - name: Render the playable 3D expedition
        run: |
          mkdir -p build/validation
          set +e
          xvfb-run -a godot --path . -- --smoke-expedition 2>&1 | tee render-smoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            test -s build/validation/expedition-render.png && test -s build/validation/rv-cockpit-render.png
            status=$?
          fi
          {
            echo '### Playable 3D render smoke log'
            echo '```text'
            tail -120 render-smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            detail=$(tail -100 render-smoke.log | tr '\n' '|' | cut -c 1-7000)
            detail=${detail//'%'/'%25'}; detail=${detail//$'\r'/'%0D'}
            echo "::error file=scenes/main.tscn,title=Playable 3D render smoke::$detail"
          fi
          exit $status
      - name: Emit compact render previews
        if: github.event_name == 'workflow_dispatch' && inputs.emit_preview_log == true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          for source in build/validation/expedition-render.png build/validation/rv-cockpit-render.png; do
            label=$(basename "$source" .png)
            convert "$source" -resize 480x270 -strip -quality 72 "/tmp/${label}.jpg"
            echo "${label}_BASE64_BEGIN"
            base64 -w0 "/tmp/${label}.jpg"
            echo
            echo "${label}_BASE64_END"
          done
      - name: Upload 3D render proof
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dustbound-expedition-render-proof
          path: build/validation/
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export debug APK
        run: |
          mkdir -p build/android
          set +e
          godot --headless --path . --export-debug Android build/android/DustboundExpeditions.apk 2>&1 | tee android-export.log
          status=${PIPESTATUS[0]}
          {
            echo '### Android export log'
            echo '```text'
            tail -100 android-export.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            detail=$(tail -80 android-export.log | tr '\n' '|' | cut -c 1-7000)
            detail=${detail//'%'/'%25'}; detail=${detail//$'\r'/'%0D'}
            echo "::error file=export_presets.cfg,title=Godot Android full log::$detail"
          fi
          exit $status
      - name: Verify Android landscape lock
        run: |
          set +e
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$aapt2" dump xmltree build/android/DustboundExpeditions.apk --file AndroidManifest.xml > android-manifest.txt 2>android-manifest-error.txt
          dump_status=$?
          orientation=$(grep 'screenOrientation' android-manifest.txt || true)
          echo "aapt2 status: $dump_status"
          echo "orientation: $orientation"
          cat android-manifest-error.txt
          # ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE is the integer value 0.
          echo "$orientation" | grep -Eq '(\(type 0x10\)0x0|=0)([[:space:]]|$)'
          status=$?
          if [ "$dump_status" -ne 0 ] || [ "$status" -ne 0 ]; then
            detail="aapt2 status=$dump_status; orientation=$orientation; error=$(tr '\n' '|' < android-manifest-error.txt)"
            detail=${detail//'%'/'%25'}; detail=${detail//$'\r'/'%0D'}
            echo "::error file=project.godot,title=Android landscape manifest::$detail"
            exit 1
          fi
          echo 'Android manifest verified: the game activity is locked to landscape (value 0).' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android game
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dustbound-expeditions-android
          path: build/android/DustboundExpeditions.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Export iOS Xcode project
    runs-on: macos-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export iOS Xcode project
        run: |
          mkdir -p build/ios
          set +e
          godot --headless --path . --export-debug iOS build/ios/DustboundExpeditions.zip 2>&1 | tee ios-export.log
          status=${PIPESTATUS[0]}
          {
            echo '### iOS export log'
            echo '```text'
            tail -100 ios-export.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            detail=$(tail -80 ios-export.log | tr '\n' '|' | cut -c 1-7000)
            detail=${detail//'%'/'%25'}; detail=${detail//$'\r'/'%0D'}
            echo "::error file=export_presets.cfg,title=Godot iOS full log::$detail"
          fi
          exit $status
      - name: Upload iOS project
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dustbound-expeditions-ios-xcode
          # Project-only exports are an expanded .xcodeproj plus its source folder;
          # upload-artifact packages both into the downloadable artifact archive.
          path: build/ios/
          if-no-files-found: error
          retention-days: 30

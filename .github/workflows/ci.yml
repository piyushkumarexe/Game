name: Build

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dustbound-rv-web
          path: dist
          if-no-files-found: error
          retention-days: 14
